name: Diagnose public iQIYI and Tencent metadata
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect anonymous search and playback metadata
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          agent = 'Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/124.0 Mobile Safari/537.36'
          def fetch(url, referer=''):
              headers = {'User-Agent': agent, 'Accept-Language': 'zh-CN,zh;q=0.9'}
              if referer: headers['Referer'] = referer
              request = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      return response.status, response.read(2_000_000).decode('utf-8', 'replace')
              except Exception as error:
                  return type(error).__name__, ''

          code, body = fetch('https://mesh.if.iqiyi.com/portal/lw/search/homePage?key=' + urllib.parse.quote('中国好声音'))
          print('IQIYI_SEARCH_HTTP', code)
          try: docs = json.loads(body).get('data', {}).get('docinfos') or []
          except ValueError: docs = []
          print('IQIYI_DOC_COUNT', len(docs), 'titles=', [(document.get('albumDocInfo') or {}).get('albumTitle') for document in docs[:20]])
          for document in docs:
              album = document.get('albumDocInfo') or {}
              if '中国好声音精编版' not in album.get('albumTitle', ''): continue
              print('IQIYI_ALBUM', json.dumps({key: album.get(key) for key in ('albumId', 'qipu_id', 'albumTitle', 'albumLink', 'itemTotalNumber')}, ensure_ascii=False))
              rows = album.get('videoinfos') or []
              print('IQIYI_PREVIEW', len(rows), json.dumps([{key: row.get(key) for key in ('itemTitle', 'itemNumber', 'itemLink')} for row in rows[:8]], ensure_ascii=False))
              for aid in (album.get('qipu_id'), album.get('albumId')):
                  if not aid: continue
                  code, body = fetch('https://pcw-api.iqiyi.com/albums/album/avlistinfo?aid=' + urllib.parse.quote(str(aid)) + '&page=1&size=100', 'https://www.iqiyi.com/')
                  try: payload = json.loads(body)
                  except ValueError: payload = {}
                  data = payload.get('data') or {}
                  episodes = data.get('epsodelist') or data.get('episodeList') or []
                  print('IQIYI_LIST', aid, 'http=', code, 'code=', payload.get('code'), 'total=', data.get('total'), 'rows=', len(episodes))
                  print('IQIYI_ROWS', json.dumps([{key: row.get(key) for key in ('name', 'shortTitle', 'playUrl', 'tvId')} for row in episodes[:3]], ensure_ascii=False))

          page = 'https://v.qq.com/x/cover/x0044ttcb30.html'
          code, body = fetch('https://vv.video.qq.com/getinfo?vids=x0044ttcb30&platform=101001&charge=0&otype=json&defn=shd', page)
          try: payload = json.loads(body.strip().removeprefix('QZOutputJson=').removesuffix(';'))
          except ValueError: payload = {}
          video = ((payload.get('vl') or {}).get('vi') or [{}])[0]
          print('TENCENT_PLAY', 'http=', code, 'code=', payload.get('code'), 'em=', payload.get('em'), 'video_keys=', list(video.keys()), 'filename_present=', bool(video.get('fn')), 'key_present=', bool(video.get('fvkey')))
          bases = ((video.get('ul') or {}).get('ui') or [])
          print('TENCENT_MEDIA_SHAPE', 'filename_suffix=', str(video.get('fn', '')).split('?')[0].rsplit('.', 1)[-1], 'base_schemes=', [urllib.parse.urlparse(item.get('url', '')).scheme for item in bases[:4]], 'base_hosts=', [urllib.parse.urlparse(item.get('url', '')).hostname for item in bases[:4]], 'drm=', bool(video.get('drm')), 'encryption=', bool(video.get('encryption')), 'preview=', video.get('isprevid'))
          print('TENCENT_INFO', 'msg=', str(payload.get('msg', ''))[:140])
          PY
