name: Probe public Youku search responses
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public search cards
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          for query in ('我是歌手', '歌手', '中国好声音'):
              encoded = urllib.parse.quote(query)
              for base in ('https://search.youku.com/api/search?keyword=',):
                  url = base + encoded
                  req = urllib.request.Request(url, headers={
                      'User-Agent': 'Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/124.0 Mobile Safari/537.36',
                      'Referer': 'https://so.youku.com/search_video/q_' + encoded,
                      'Accept-Language': 'zh-CN,zh;q=0.9',
                  })
                  try:
                      with urllib.request.urlopen(req, timeout=25) as response:
                          payload = json.load(response)
                      rows = payload.get('pageComponentList') or []
                      print(query, 'cards', len(rows))
                      for row in rows[:12]:
                          common = row.get('commonData') or {}
                          print(json.dumps({key: common.get(key) for key in ('titleDTO', 'title', 'showName', 'name', 'showId', 'realShowId', 'isYouku', 'episodeTotal')}, ensure_ascii=False))
                  except Exception as exc:
                      print(query, type(exc).__name__, str(exc)[:160])
          PY
