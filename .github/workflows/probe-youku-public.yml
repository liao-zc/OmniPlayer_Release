name: Diagnose public Youku search and episodes
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect anonymous public metadata
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          import urllib.parse
          import urllib.request

          agent = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0.0.0 Safari/537.36'

          def fetch(url):
              request = urllib.request.Request(url, headers={'User-Agent': agent, 'Referer': 'https://www.youku.com/', 'Accept-Language': 'zh-CN,zh;q=0.9'})
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      return response.status, response.read(3_000_000).decode('utf-8', 'replace')
              except Exception as error:
                  return type(error).__name__, ''

          for phrase in ('我是歌手', '少年包青天'):
              code, body = fetch('https://search.youku.com/api/search?keyword=' + urllib.parse.quote(phrase))
              print('SEARCH', phrase, 'http=', code)
              try:
                  cards = json.loads(body).get('pageComponentList') or []
              except ValueError:
                  cards = []
              for card in cards[:20]:
                  common = card.get('commonData') or {}
                  print('CARD', json.dumps({key: common.get(key) for key in ('isYouku', 'showId', 'realShowId', 'videoId', 'title', 'showName', 'name', 'titleDTO', 'episodeTotal')}, ensure_ascii=False)[:700])
              search_url = 'https://so.youku.com/search_video/q_' + urllib.parse.quote(phrase)
              code, html = fetch(search_url)
              titles = re.findall(r'<title[^>]*>(.*?)</title>', html, re.I | re.S)
              links = re.findall(r'<a[^>]+(?:href|title)=["\'][^"\']*(?:v_show|show_page|歌手)[^"\']*["\'][^>]*>', html, re.I)
              print('HTML', phrase, 'http=', code, 'title=', titles[:1], 'matching_links=', links[:6])

          code, html = fetch('https://v.youku.com/v_show/id_XMTU5ODYxMzU2.html')
          print('DETAIL', 'http=', code, 'bytes=', len(html), 'initial_data=', '__INITIAL_DATA__' in html)
          for pattern in ('episodeTotal', 'episodeList', 'episode_list', 'showId', 'realShowId', 'stage', 'playlist', 'get_episodes'):
              print('DETAIL_KEY', pattern, html.count(pattern))
          marker = html.find('__INITIAL_DATA__')
          start = html.find('{', marker) if marker >= 0 else -1
          if start >= 0:
              decoder = json.JSONDecoder()
              try:
                  root, _ = decoder.raw_decode(html[start:])
              except ValueError as error:
                  print('DETAIL_JSON_ERROR', str(error)[:120])
              else:
                  print('DETAIL_ROOT_KEYS', list(root.keys())[:30])
                  rows = []
                  def visit(value):
                      if isinstance(value, list):
                          for child in value: visit(child)
                      elif isinstance(value, dict):
                          if value.get('videoId'):
                              rows.append({key: value.get(key) for key in ('videoId', 'showId', 'realShowId', 'stage', 'title', 'displayName', 'titleDTO', 'name')})
                          for child in value.values(): visit(child)
                  visit(root)
                  print('DETAIL_VIDEO_ROWS', len(rows))
                  for row in rows[:12]: print('DETAIL_VIDEO', json.dumps(row, ensure_ascii=False)[:500])
          for url in ('https://v.youku.com/video?s=dbaf170e26f84d30ba72', 'https://v.youku.com/video?vid=XNjEyMTczODY1Mg=='):
              code, page = fetch(url)
              title = re.findall(r'<title[^>]*>(.*?)</title>', page, re.I | re.S)[:1]
              print('VIDEO_PAGE', url.split('?')[1][:7], 'http=', code, 'title=', title, 'bytes=', len(page))
          PY
