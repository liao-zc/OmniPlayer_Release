name: Diagnose public Bilibili media
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check selected public BV and playurl responses
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.parse
          import urllib.request

          agent = 'Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/124.0 Mobile Safari/537.36'
          videos = ('BV1xh411o77t', 'BV1aS411A7DN', 'BV1cwhv6mEe2')

          def fetch(url, referer):
              request = urllib.request.Request(url, headers={
                  'User-Agent': agent,
                  'Accept-Language': 'zh-CN,zh;q=0.9',
                  'Referer': referer,
              })
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      return response.status, response.read(2_000_000)
              except urllib.error.HTTPError as error:
                  return error.code, error.read(2_000_000)
              except Exception as error:
                  return type(error).__name__, b''

          for bvid in videos:
              page = f'https://www.bilibili.com/video/{bvid}'
              page_status, _ = fetch(page, page)
              view_url = 'https://api.bilibili.com/x/web-interface/view?bvid=' + urllib.parse.quote(bvid)
              view_status, view_bytes = fetch(view_url, page)
              try:
                  view = json.loads(view_bytes)
              except ValueError:
                  view = {}
              data = view.get('data') or {}
              pages = data.get('pages') or []
              cid = pages[0].get('cid') if pages else None
              print(f'{bvid} page_http={page_status} view_http={view_status} view_code={view.get("code")} page_count={len(pages)} cid_present={bool(cid)}')
              for label, alternate in (
                  ('detail', 'https://api.bilibili.com/x/web-interface/view/detail?bvid=' + urllib.parse.quote(bvid)),
                  ('pagelist', 'https://api.bilibili.com/x/player/pagelist?bvid=' + urllib.parse.quote(bvid)),
                  ('appview', 'https://app.bilibili.com/x/v2/view?bvid=' + urllib.parse.quote(bvid) + '&mobi_app=android&build=1002000&platform=android'),
              ):
                  alternate_status, alternate_bytes = fetch(alternate, page)
                  try:
                      alternate_data = json.loads(alternate_bytes)
                  except ValueError:
                      alternate_data = {}
                  body = alternate_data.get('data') or {}
                  alternate_pages = body if isinstance(body, list) else body.get('pages') or []
                  alternate_cid = alternate_pages[0].get('cid') if alternate_pages else None
                  cid = cid or alternate_cid
                  print(f'{bvid} {label}_http={alternate_status} code={alternate_data.get("code")} cid_present={bool(alternate_cid)}')
              if cid:
                  query = urllib.parse.urlencode({'bvid': bvid, 'cid': cid, 'qn': 16, 'fnval': 0, 'fnver': 0, 'fourk': 0, 'platform': 'html5'})
                  play_status, play_bytes = fetch('https://api.bilibili.com/x/player/playurl?' + query, page)
                  try:
                      play = json.loads(play_bytes)
                  except ValueError:
                      play = {}
                  rows = (play.get('data') or {}).get('durl') or []
                  media_path = urllib.parse.urlparse(rows[0].get('url', '')).path if rows else ''
                  suffix = media_path.rsplit('.', 1)[-1] if '.' in media_path else '<none>'
                  backups = len(rows[0].get('backup_url') or []) if rows else 0
                  print(f'{bvid} play_http={play_status} play_code={play.get("code")} durl_count={len(rows)} suffix={suffix} backups={backups}')
          PY
