name: OmniPlayer focused network playback acceptance
on:
  workflow_dispatch:
    inputs:
      artifact_tag:
        description: Draft release containing acceptance APKs
        required: true
        type: string
      version:
        description: APK version (baseline or current)
        required: true
        type: choice
        options: [baseline, current]
      site:
        description: Provider ID
        required: true
        type: choice
        options: [youku, iqiyi, tencent, mango, bilibili]
      query:
        description: Query ID
        required: true
        type: choice
        options: [boy-detective, singer, voice]
permissions:
  contents: write
jobs:
  playback:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      ARTIFACT_TAG: ${{ inputs.artifact_tag }}
      VERSION: ${{ inputs.version }}
      SITE: ${{ inputs.site }}
      QUERY: ${{ inputs.query }}
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Download acceptance APKs
        run: |
          mkdir -p acceptance-apks
          gh release download "$ARTIFACT_TAG" --repo "$GITHUB_REPOSITORY" --pattern "network-$VERSION-*.apk" --dir acceptance-apks
          test -s "acceptance-apks/network-$VERSION-app.apk"
          test -s "acceptance-apks/network-$VERSION-test.apk"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install emulator with download retries
        run: |
          for attempt in 1 2 3; do
            if sdkmanager --install emulator --channel=0; then exit 0; fi
            sleep 10
          done
          exit 1
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            set -u
            adb install -r "acceptance-apks/network-$VERSION-app.apk" || exit 1
            adb install -r "acceptance-apks/network-$VERSION-test.apk" || exit 1
            mkdir -p acceptance-results
            adb logcat -c
            adb shell am instrument -w -r -e class com.omniplayer.NetworkSearchParityAcceptanceTest -e networkSite "$SITE" -e networkQuery "$QUERY" com.OmniPlayer.test/androidx.test.runner.AndroidJUnitRunner > "acceptance-results/$VERSION-$SITE-$QUERY.txt" 2>&1
            adb logcat -d -s NetworkWebPlayer:I NetworkPlaybackEvidence:I NetworkParityRows:I NetworkEpisodeProbe:I NetworkAccessRestriction:I NetworkSearchYouku:I '*:S' >> "acceptance-results/$VERSION-$SITE-$QUERY.txt"
            cat "acceptance-results/$VERSION-$SITE-$QUERY.txt"
            grep -q 'OK (1 test)' "acceptance-results/$VERSION-$SITE-$QUERY.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focused-${{ inputs.version }}-${{ inputs.site }}-${{ inputs.query }}
          path: acceptance-results/
