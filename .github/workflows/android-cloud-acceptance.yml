name: OmniPlayer network playback cloud acceptance
on:
  workflow_dispatch:
    inputs:
      artifact_tag:
        description: Draft release containing the four acceptance APKs
        required: true
        type: string
permissions:
  contents: read
jobs:
  playback:
    strategy:
      fail-fast: false
      matrix:
        version: [baseline, current]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android API 35 platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Download the precompiled app and instrumentation APKs
        env:
          ARTIFACT_TAG: ${{ inputs.artifact_tag }}
        run: |
          mkdir -p acceptance-apks
          gh release download "$ARTIFACT_TAG" --repo "$GITHUB_REPOSITORY" --pattern "network-${{ matrix.version }}-*.apk" --dir acceptance-apks
          test -s "acceptance-apks/network-${{ matrix.version }}-app.apk"
          test -s "acceptance-apks/network-${{ matrix.version }}-test.apk"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            set -u
            adb install -r "acceptance-apks/network-${{ matrix.version }}-app.apk" || exit 1
            adb install -r "acceptance-apks/network-${{ matrix.version }}-test.apk" || exit 1
            failures=0
            mkdir -p acceptance-results
            for site in youku iqiyi tencent mango bilibili; do
              for query in boy-detective singer voice; do
                result="acceptance-results/${{ matrix.version }}-$site-$query.txt"
                adb shell am instrument -w -r -e class com.omniplayer.NetworkSearchParityAcceptanceTest -e networkSite "$site" -e networkQuery "$query" com.OmniPlayer.test/androidx.test.runner.AndroidJUnitRunner > "$result" 2>&1
                if grep -q 'INSTRUMENTATION_CODE: -1' "$result" && grep -q 'OK (' "$result"; then
                  echo "PASS $site $query"
                else
                  echo "FAIL $site $query"
                  failures=$((failures + 1))
                fi
                adb shell am force-stop com.OmniPlayer || true
              done
            done
            test "$failures" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: network-${{ matrix.version }}-results
          path: acceptance-results/
